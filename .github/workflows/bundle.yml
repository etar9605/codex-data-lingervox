name: Auto Bundle Codex Updates

on:
  push:
    paths:
      - 'data/**'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run bundle script
        run: node bundle.js

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add manifest.json update-data-latest.json
          git diff --staged --quiet || git commit -m "chore: auto-bundle codex data [skip ci]"
          git push
